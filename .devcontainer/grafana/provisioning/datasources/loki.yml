apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    isDefault: true
    editable: true

  - name: Loki (multi-tenant)
    type: loki
    access: proxy
    url: http://localhost:3110
    editable: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      # Matches the tenant used by MultitenantSupportTest
      httpHeaderValue1: tenantX
